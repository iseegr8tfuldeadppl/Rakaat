// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral() // Replaced jcenter() with mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral() // Kept mavenCentral(), removed jcenter()

        // Removed the duplicate google() entry
        // Removed the dead Bintray URL (https://dl.bintray.com/batoulapps/adhan)
        // Note: The Adhan library is now hosted on Maven Central, so mavenCentral() will cover it.
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}